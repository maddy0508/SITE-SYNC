name: M1.7 apply hardened acceptance controls

on:
  push:
    branches:
      - m17-qa-hardened
    paths:
      - .github/workflows/m17-apply-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch M1.7 acceptance harness
        env:
          TARGET: sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx")
          text = path.read_text()

          new_conflict = r'''  const conflictReplay = async () => {
    if (!context) return;
    setRunning(true);
    try {
      await runtime.stop();
      const assignment = context.activeProjectAssignments[0];
      const latest = await getDb().execute(`SELECT base_revision FROM command_ledger WHERE project_id=? AND person_id=? ORDER BY created_at DESC LIMIT 1`, [assignment.projectId, context.person.id]);
      if (!latest.rows.length) throw new Error('No local command exists for conflict setup');
      const currentRevision = Number((latest.rows.item(0) as Record<string, unknown>).base_revision) + 1;
      const basePayloadResult = await getDb().execute(`SELECT command_payload_json FROM command_ledger WHERE project_id=? AND person_id=? ORDER BY created_at DESC LIMIT 1`, [assignment.projectId, context.person.id]);
      const basePayload = JSON.parse(String((basePayloadResult.rows.item(0) as Record<string, unknown>).command_payload_json));
      const serverCheckInId = uuidV4();
      const serverCheckInEventId = uuidV4();
      const serverCheckInPayload = { ...basePayload, commandId: serverCheckInId, eventId: serverCheckInEventId, commandType: 'CHECK_IN', eventType: 'ATTENDANCE_CHECK_IN', clientOccurredAt: nowUtc(), workDateUtc: nowUtc().substring(0, 10), baseRevision: Number((latest.rows.item(0) as Record<string, unknown>).base_revision) };
      const serverCheckIn = await client.rpc('sync_attendance_command', {
        command_id: serverCheckInId,
        device_installation_id: context.device?.deviceInstallationId,
        project_id: assignment.projectId,
        person_id: context.person.id,
        work_date_utc: serverCheckInPayload.workDateUtc,
        base_revision: serverCheckInPayload.baseRevision,
        command_type: 'CHECK_IN',
        payload: serverCheckInPayload,
      });
      if (serverCheckIn.error || (serverCheckIn.data as Record<string, unknown> | null)?.status !== 'ACCEPTED') throw new Error(`Server setup CHECK_IN failed: ${serverCheckIn.error?.message ?? JSON.stringify(serverCheckIn.data)}`);

      const local = await AttendanceService.checkIn({ context, projectId: assignment.projectId, targetPersonId: context.person.id, targetAssignment: assignment, source: 'SELF', clientOccurredAt: nowUtc(), online: false });
      const localCommandId = local.command.commandId;
      const localPayloadResult = await getDb().execute(`SELECT command_payload_json FROM command_ledger WHERE command_id=?`, [localCommandId]);
      const localPayload = JSON.parse(String((localPayloadResult.rows.item(0) as Record<string, unknown>).command_payload_json));
      const serverCheckOutId = uuidV4();
      const serverCheckOutEventId = uuidV4();
      const serverCheckOutPayload = { ...localPayload, commandId: serverCheckOutId, eventId: serverCheckOutEventId, commandType: 'CHECK_OUT', eventType: 'ATTENDANCE_CHECK_OUT', clientOccurredAt: nowUtc(), workDateUtc: localPayload.workDateUtc, baseRevision: local.state.currentRevision };
      const serverCheckOut = await client.rpc('sync_attendance_command', {
        command_id: serverCheckOutId,
        device_installation_id: context.device?.deviceInstallationId,
        project_id: assignment.projectId,
        person_id: context.person.id,
        work_date_utc: localPayload.workDateUtc,
        base_revision: local.state.currentRevision,
        command_type: 'CHECK_OUT',
        payload: serverCheckOutPayload,
      });
      if (serverCheckOut.error || (serverCheckOut.data as Record<string, unknown> | null)?.status !== 'ACCEPTED') throw new Error(`Server conflict setup CHECK_OUT failed: ${serverCheckOut.error?.message ?? JSON.stringify(serverCheckOut.data)}`);

      await runtime.start();
      const result = await runtime.requestManualSync();
      const command = await getDb().execute(`SELECT status, server_revision, server_error_code FROM command_ledger WHERE command_id=?`, [localCommandId]);
      const commandRow = command.rows.item(0) as Record<string, unknown>;
      const attendance = await getDb().execute(`SELECT state, current_revision, server_revision, sync_status FROM attendance_state WHERE project_id=? AND person_id=? ORDER BY work_date_utc DESC LIMIT 1`, [assignment.projectId, context.person.id]);
      const attendanceRow = attendance.rows.item(0) as Record<string, unknown>;
      const serverRevision = Number((serverCheckOut.data as Record<string, unknown>).server_revision);
      const passed = result.status === 'CONFLICT' && commandRow.status === 'CONFLICT' && Number(commandRow.server_revision ?? 0) === serverRevision && attendanceRow.state === 'CHECKED_OUT' && Number(attendanceRow.server_revision ?? 0) === serverRevision && attendanceRow.sync_status === 'CONFLICT';
      setResult(10, passed ? 'PASS' : 'FAIL', `Real worker conflict path: ${result.status}; command ${String(commandRow.status)}; authoritative revision ${serverRevision}; local state ${String(attendanceRow.state)} / server rev ${String(attendanceRow.server_revision)}.`);
      await refreshLocalState();
    } catch (error) {
      setResult(10, 'FAIL', error instanceof Error ? error.message : String(error));
    } finally { setRunning(false); }
  };
'''

          new_failure = r'''  const failurePaths = async () => {
    if (!context) return;
    setRunning(true);
    try {
      const assignment = context.activeProjectAssignments[0];
      await runtime.stop();
      const seed = await getDb().execute(`SELECT organisation_id, company_id, command_type, source, base_revision, max_attempts, command_payload_json FROM command_ledger WHERE project_id=? AND person_id=? ORDER BY created_at DESC LIMIT 1`, [assignment.projectId, context.person.id]);
      if (!seed.rows.length) throw new Error('No seed command exists for failure-path probes');
      const seedRow = seed.rows.item(0) as Record<string, unknown>;
      const seedPayload = JSON.parse(String(seedRow.command_payload_json));
      const insertProbe = async (payload: Record<string, unknown>, projectId: string, personId: string, organisationId: string, companyId: string, baseRevision: number) => {
        const commandId = String(payload.commandId);
        const now = nowUtc();
        await getDb().execute(`INSERT INTO command_ledger (command_id, project_id, person_id, organisation_id, company_id, command_type, source, base_revision, status, attempt_count, max_attempts, processing_started_at, server_responded_at, synced_at, next_retry_at, server_result_json, server_error_code, failure_diagnostics, created_at, updated_at, command_payload_json) VALUES (?, ?, ?, ?, ?, ?, ?, ?, 'PENDING', 0, ?, NULL, NULL, NULL, NULL, NULL, NULL, NULL, ?, ?, ?)`, [commandId, projectId, personId, organisationId, companyId, String(payload.commandType), String(payload.source), baseRevision, Number(seedRow.max_attempts ?? 3), now, now, JSON.stringify(payload)]);
        return commandId;
      };

      const validationId = uuidV4();
      const validationPayload = { ...seedPayload, commandId: validationId, eventId: uuidV4(), commandType: String(seedRow.command_type), clientOccurredAt: new Date(Date.now() + 86400000).toISOString(), workDateUtc: new Date(Date.now() + 86400000).toISOString().substring(0, 10) };
      const validationCommand = await insertProbe(validationPayload, assignment.projectId, context.person.id, String(seedRow.organisation_id), String(seedRow.company_id), Number(seedRow.base_revision));
      await runtime.start();
      let validationResult = await runtime.requestManualSync();
      let validationRow = (await getDb().execute(`SELECT status, server_error_code FROM command_ledger WHERE command_id=?`, [validationCommand])).rows.item(0) as Record<string, unknown>;
      if (validationResult.status !== 'FAILED' || String(validationRow.server_error_code ?? '') !== 'WORK_DATE_MISMATCH') throw new Error(`Authoritative validation probe failed: ${validationResult.status}/${String(validationRow.server_error_code)}`);

      await runtime.stop();
      const authorizationId = uuidV4();
      const otherCompanyPerson = 'cccccccc-cccc-cccc-cccc-300000000003';
      const otherCompanyAssignment = 'dba039cf-0761-4bf8-af62-7d3bcbcb755c';
      const authorizationPayload = { ...seedPayload, commandId: authorizationId, eventId: uuidV4(), personId: otherCompanyPerson, projectAssignmentId: otherCompanyAssignment, clientOccurredAt: nowUtc(), workDateUtc: nowUtc().substring(0, 10) };
      const authorizationCommand = await insertProbe(authorizationPayload, assignment.projectId, otherCompanyPerson, String(seedRow.organisation_id), 'bbbbbbbb-bbbb-bbbb-bbbb-200000000002', Number(seedRow.base_revision));
      await runtime.start();
      const authorizationResult = await runtime.requestManualSync();
      const authorizationRow = (await getDb().execute(`SELECT status, server_error_code FROM command_ledger WHERE command_id=?`, [authorizationCommand])).rows.item(0) as Record<string, unknown>;
      if (authorizationResult.status !== 'FAILED' || String(authorizationRow.server_error_code ?? '') !== 'NOT_AUTHORIZED') throw new Error(`Cross-company authorization probe failed: ${authorizationResult.status}/${String(authorizationRow.server_error_code)}`);

      await runtime.stop();
      const revokedId = uuidV4();
      const revokedPayload = { ...seedPayload, commandId: revokedId, eventId: uuidV4(), clientOccurredAt: nowUtc(), workDateUtc: nowUtc().substring(0, 10) };
      const revokedCommand = await insertProbe(revokedPayload, assignment.projectId, context.person.id, String(seedRow.organisation_id), String(seedRow.company_id), Number(seedRow.base_revision));
      const revoke = await client.rpc('m17_qa_revoke_current_device', { p_device_id: context.device?.deviceInstallationId });
      if (revoke.error) throw new Error(`QA device revoke failed: ${revoke.error.message}`);
      await runtime.start();
      const revokedResult = await runtime.requestManualSync();
      const revokedRow = (await getDb().execute(`SELECT status, server_error_code FROM command_ledger WHERE command_id=?`, [revokedCommand])).rows.item(0) as Record<string, unknown>;
      if (revokedResult.status !== 'FAILED' || String(revokedRow.server_error_code ?? '') !== 'DEVICE_REVOKED') throw new Error(`Revoked-device probe failed: ${revokedResult.status}/${String(revokedRow.server_error_code)}`);

      await runtime.stop();
      await resolveAuthenticatedContext();
      setResult(11, 'NOT_PROVEN', 'Authoritative validation rejection, cross-company authorization rejection, and revoked-device rejection passed through the real worker. Retryable transport remains to be proven with physical network loss.');
    } catch (error) {
      setResult(11, 'FAIL', error instanceof Error ? error.message : String(error));
    } finally { setRunning(false); }
  };

  const retryableTransport = async () => {
    if (!context) return;
    setRunning(true);
    try {
      const response = await fetch(M17_SUPABASE_URL, { method: 'HEAD' });
      if (response) {
        setResult(11, 'NOT_PROVEN', 'Transport endpoint is reachable. Turn Wi-Fi and mobile data OFF, then press RETRYABLE TRANSPORT again.');
        return;
      }
    } catch {
      // Expected when physical connectivity is disabled.
    }
    await runtime.stop();
    const assignment = context.activeProjectAssignments[0];
    const seed = await getDb().execute(`SELECT organisation_id, company_id, command_type, source, base_revision, max_attempts, command_payload_json FROM command_ledger WHERE project_id=? AND person_id=? ORDER BY created_at DESC LIMIT 1`, [assignment.projectId, context.person.id]);
    if (!seed.rows.length) throw new Error('No seed command exists for transport probe');
    const seedRow = seed.rows.item(0) as Record<string, unknown>;
    const payload = JSON.parse(String(seedRow.command_payload_json));
    const commandId = uuidV4();
    const now = nowUtc();
    const future = new Date(Date.now() + 86400000).toISOString();
    const probePayload = { ...payload, commandId, eventId: uuidV4(), clientOccurredAt: future, workDateUtc: future.substring(0, 10) };
    await getDb().execute(`INSERT INTO command_ledger (command_id, project_id, person_id, organisation_id, company_id, command_type, source, base_revision, status, attempt_count, max_attempts, processing_started_at, server_responded_at, synced_at, next_retry_at, server_result_json, server_error_code, failure_diagnostics, created_at, updated_at, command_payload_json) VALUES (?, ?, ?, ?, ?, ?, ?, ?, 'PENDING', 0, ?, NULL, NULL, NULL, NULL, NULL, NULL, NULL, ?, ?, ?)`, [commandId, assignment.projectId, context.person.id, String(seedRow.organisation_id), String(seedRow.company_id), String(probePayload.commandType), String(probePayload.source), Number(seedRow.base_revision), Number(seedRow.max_attempts ?? 3), now, now, JSON.stringify(probePayload)]);
    await runtime.start();
    await new Promise(resolve => setTimeout(resolve, 750));
    const row = (await getDb().execute(`SELECT status, next_retry_at, server_error_code FROM command_ledger WHERE command_id=?`, [commandId])).rows.item(0) as Record<string, unknown>;
    const retryable = row.status === 'RETRYABLE_FAILURE' && row.server_error_code === 'TRANSPORT' && row.next_retry_at;
    setResult(11, retryable ? 'PASS' : 'FAIL', retryable ? `Physical transport loss produced durable RETRYABLE_FAILURE with next_retry_at=${String(row.next_retry_at)}.` : `Expected RETRYABLE_FAILURE but observed ${String(row.status)}/${String(row.server_error_code)}.`);
    await refreshLocalState();
    setRunning(false);
  };
'''

          def replace_between(src, start, end, replacement):
              pattern = re.compile(re.escape(start) + r'.*?(?=\n' + re.escape(end) + r')', re.S)
              out, n = pattern.subn(replacement.rstrip(), src, count=1)
              if n != 1:
                  raise SystemExit(f"failed to replace block starting {start}")
              return out

          text = replace_between(text, '  const conflictReplay = async () => {', '  const failurePaths = async () => {', new_conflict)
          text = replace_between(text, '  const failurePaths = async () => {', '  const lifecycleStress = async () => {', new_failure)

          old_button = '<Pressable style={styles.secondary} disabled={running} onPress={() => void failurePaths()}><Text style={styles.secondaryText}>11 · FAILURE-PATH AUDIT</Text></Pressable>'
          new_button = '<Pressable style={styles.secondary} disabled={running} onPress={() => void failurePaths()}><Text style={styles.secondaryText}>11A · SERVER FAILURE-PATH AUDIT</Text></Pressable>\n        <Pressable style={styles.secondary} disabled={running} onPress={() => void retryableTransport()}><Text style={styles.secondaryText}>11B · RETRYABLE TRANSPORT (NETWORK OFF)</Text></Pressable>'
          if old_button not in text:
              raise SystemExit('failure-path button not found')
          text = text.replace(old_button, new_button, 1)

          path.write_text(text)
          PY

      - name: Validate source shape
        run: |
          grep -q "10 · AUTHORITATIVE STALE-REVISION CONFLICT" sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx
          grep -q "11B · RETRYABLE TRANSPORT" sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx
          grep -q "m17_qa_revoke_current_device" sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx

      - name: Remove temporary patch workflow
        run: rm -f .github/workflows/m17-apply-hardening-patch.yml

      - name: Commit hardened acceptance harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx .github/workflows/m17-apply-hardening-patch.yml
          git commit -m "feat(m17): harden physical conflict and failure-path acceptance"
          git push origin HEAD:m17-qa-hardened
