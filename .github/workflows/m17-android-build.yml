name: M1.7 physical QA Android build

on:
  workflow_dispatch:
  push:
    branches:
      - 'm17-real-app-runtime'
    paths:
      - 'sitesync/**'
      - '.github/workflows/m17-android-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/**'
      - '.github/workflows/m17-android-build.yml'

permissions:
  contents: read

jobs:
  android-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: sitesync
        run: npm ci --ignore-scripts
      - name: Verify Jest suite before packaging
        working-directory: sitesync
        run: npm test -- --runInBand
      - name: Verify TypeScript before packaging
        working-directory: sitesync
        run: npm run typecheck --if-present
      - name: Verify ESLint before packaging
        working-directory: sitesync
        run: npm run lint --if-present
      - name: Assemble physical M1.7 QA APK
        working-directory: sitesync/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Write APK provenance manifest
        working-directory: sitesync/android
        run: |
          printf 'M1.7 physical QA APK\ncommit=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > app/build/outputs/apk/release/M1.7-QA-PROVENANCE.txt
      - name: Upload M1.7 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: sitesync-m1.7-physical-qa-apk
          path: |
            sitesync/android/app/build/outputs/apk/release/*.apk
            sitesync/android/app/build/outputs/apk/release/M1.7-QA-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
