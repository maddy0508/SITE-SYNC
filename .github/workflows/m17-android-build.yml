name: M1.7 physical QA Android build

on:
  workflow_dispatch:
  push:
    branches:
      - 'm17-real-app-runtime'
    paths:
      - 'sitesync/**'
      - '.github/workflows/m17-android-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/**'
      - '.github/workflows/m17-android-build.yml'

permissions:
  contents: read

jobs:
  android-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: sitesync
        run: npm ci --ignore-scripts
      - name: Run M1.7 APK capability audit
        working-directory: sitesync
        run: node scripts/m17-capability-audit.mjs
      - name: Run full Jest suite
        working-directory: sitesync
        run: npm test -- --runInBand
      - name: TypeScript check
        working-directory: sitesync
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: sitesync
        run: npx eslint .
      - name: Reject production configuration
        working-directory: sitesync
        shell: bash
        run: |
          ! grep -R --line-number --exclude-dir=node_modules --exclude='*.md' -E 'pjosqguzbsteaoptaifw|SITE-SYNC\.supabase\.co' src android || exit 1
      - name: Assemble physical M1.7 QA APK
        working-directory: sitesync/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK exists and record SHA-256
        working-directory: sitesync
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/SITE-SYNC-M1.7-QA-APK-SHA256.txt
      - name: Write APK provenance manifest
        working-directory: sitesync
        env:
          M17_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          mkdir -p android/app/build/outputs/apk/release
          cat > android/app/build/outputs/apk/release/SITE-SYNC-M1.7-QA-PROVENANCE.txt <<EOF
          branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          commit=${M17_SOURCE_COMMIT}
          workflow=${GITHUB_WORKFLOW}
          run=${GITHUB_RUN_ID}
          isolated_project=fuaiodkyaqfandbenuol
          production_supabase_touched=false
          runtime_acceptance_contract=MMM-57
          repository_ui_contract=MMM-58
          apk_sha256=${SHA}
          EOF
      - name: Upload M1.7 QA APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: sitesync-m1.7-physical-qa-apk
          path: |
            sitesync/android/app/build/outputs/apk/release/*.apk
            sitesync/android/app/build/outputs/apk/release/SITE-SYNC-M1.7-QA-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
