name: M1.6 attendance service diagnosis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/**'
      - '.github/workflows/m16-service-diagnose.yml'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - offline check-in atomically creates command, event, state and incomplete timesheet
          - check-out appends an event, advances revision and completes first-in/last-out timesheet
          - duplicate command id rolls back the entire attempted check-out
          - event primary-key failure rolls back the command and state transition
          - authorization failure occurs before any local mutation
          - restart preserves the offline check-in and permits a later offline check-out
          - rejects check-out without an active local check-in
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand __tests__/attendanceService.test.ts -t "${{ matrix.test }}"
