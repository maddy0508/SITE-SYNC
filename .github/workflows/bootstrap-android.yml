name: Bootstrap Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-android
  cancel-in-progress: false

jobs:
  bootstrap-and-build:
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore: bootstrap native Android project') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Generate native React Native project
        if: ${{ !hashFiles('package.json') }}
        shell: bash
        run: |
          npx @react-native-community/cli@20.1.0 init SiteSync --version 0.86.2 --skip-install
          rsync -a --exclude='.git' SiteSync/ ./
          rm -rf SiteSync ios

      - name: Normalize application identity
        if: ${{ !hashFiles('package.json') }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'com.helloworld': 'com.sitesync',
              'HelloWorld': 'SiteSync',
          }
          for path in Path('android').rglob('*'):
              if path.is_file() and path.suffix in {'.kt', '.java', '.xml', '.gradle', '.kts'}:
                  text = path.read_text(errors='ignore')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated)
          PY

      - name: Install JavaScript dependencies
        run: npm install

      - name: Verify Hermes configuration
        shell: bash
        run: |
          test "$(grep -E '^hermesEnabled=' android/gradle.properties | cut -d= -f2)" = "true"

      - name: Run lint
        run: npm run lint --if-present

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK artifact
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|lib/.*/libhermes.so' >/dev/null
          sha256sum "$APK" | tee release-apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: site-sync-m1-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            release-apk.sha256
          if-no-files-found: error

      - name: Commit generated native project
        if: ${{ !hashFiles('package.json') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bootstrap native Android project"
          git push origin HEAD:main
