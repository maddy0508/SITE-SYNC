name: M1.7 server transport verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/supabase/**'
      - 'sitesync/src/sync/**'
      - 'sitesync/__tests__/supabaseSyncTransport.test.ts'
      - 'sitesync/__tests__/syncTransport.test.ts'
      - 'sitesync/__tests__/syncWorker.test.ts'
      - 'sitesync/__tests__/syncEngine.integration.test.ts'
      - 'sitesync/package.json'
      - 'sitesync/package-lock.json'
      - '.github/workflows/m17-server-verify.yml'
  push:
    branches:
      - 'm17-server-transport'
    paths:
      - 'sitesync/supabase/**'
      - 'sitesync/src/sync/**'
      - 'sitesync/__tests__/supabaseSyncTransport.test.ts'
      - 'sitesync/__tests__/syncTransport.test.ts'
      - 'sitesync/__tests__/syncWorker.test.ts'
      - 'sitesync/__tests__/syncEngine.integration.test.ts'
      - 'sitesync/package.json'
      - 'sitesync/package-lock.json'
      - '.github/workflows/m17-server-verify.yml'

permissions:
  contents: read

# Verification intentionally covers the complete migration chain, including
# the latest M1.7 compatibility hardening migration.
# Fresh acceptance rerun is required after each server-boundary correction.
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - run: test -s package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit
      - run: npm run lint

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitesync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sitesync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Supabase-compatible auth harness
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, email text);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL
      - name: Apply existing identity/device schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 -f sitesync/supabase/migrations/20260815000000_init_identity_tenancy.sql
          psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 -f sitesync/supabase/migrations/20260815000001_init_device_installations.sql
          psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE ON public.device_installations TO authenticated;"
      - name: Apply all M1.7 server migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in sitesync/supabase/migrations/20260912*.sql; do
            case "$migration" in
              *m17_sync_*) psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 -f "$migration" ;;
            esac
          done
      - name: Run M1.7 SQL acceptance suite
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 -f sitesync/supabase/tests/m17_sync_server.sql
          psql -h 127.0.0.1 -U postgres -d sitesync_test -v ON_ERROR_STOP=1 -f sitesync/supabase/tests/m17_sync_adversarial.sql
