name: M1.7 fix acceptance TypeScript
on:
  push:
    branches: [m17-qa-hardened]
    paths: [.m17-fix-trigger]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/m17_fix_ts.py
      - run: rm -f tools/m17_fix_ts.py .github/workflows/m17-fix-ts.yml .m17-fix-trigger
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(m17): correct acceptance harness timer typing"
          git push origin HEAD:m17-qa-hardened
