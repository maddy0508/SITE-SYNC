name: M1.4 Verification

on:
  push:
    branches:
      - 'mckellarmaddy/mmm-32-m14-identity-device-registration-and-project-context'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - run: npm ci
      - run: npx jest __tests__/projectContext.test.ts --runInBand --no-cache
      - run: npm run lint
      - run: npm test -- --runInBand --no-cache
      - run: git diff --check
