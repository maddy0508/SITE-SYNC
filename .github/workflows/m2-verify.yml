name: M2 product verification

on:
  push:
    branches:
      - 'm2/product-shell-today'
    paths:
      - 'sitesync/**'
      - '.github/workflows/m2-verify.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/**'
      - '.github/workflows/m2-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - name: Require committed lockfile
        run: test -s package-lock.json
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Jest
        run: npm test -- --runInBand
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
