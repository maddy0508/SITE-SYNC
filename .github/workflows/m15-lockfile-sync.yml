name: M1.5 lockfile sync

on:
  workflow_dispatch:
  push:
    branches:
      - feat/qr-attendance-milestone-final

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qr-attendance-milestone-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore(m1.5): synchronize npm lockfile"
          git push origin HEAD:feat/qr-attendance-milestone-final
