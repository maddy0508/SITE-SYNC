name: M1.6 targeted diagnosis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/**'
      - '.github/workflows/m16-diagnose.yml'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - __tests__/attendanceCommands.test.ts
          - __tests__/attendanceAuthorization.test.ts
          - __tests__/attendanceService.test.ts
          - __tests__/localPersistence.test.ts
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand "${{ matrix.test }}"
