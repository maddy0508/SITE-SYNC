name: M1.7 sync foundation verification

on:
  push:
    branches:
      - 'mckellarmaddy/mmm-35-m17-sync-engine-foundation*'
    paths:
      - 'sitesync/**'
      - '.github/workflows/m17-verify.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sitesync/**'
      - '.github/workflows/m17-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json
      - name: Require committed lockfile
        run: test -s package-lock.json
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Run full Jest suite
        id: jest
        continue-on-error: true
        run: npm test -- --runInBand 2>&1 | tee jest.log
      - name: Upload Jest diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m17-jest-log-${{ github.run_id }}
          path: sitesync/jest.log
          if-no-files-found: error
      - name: TypeScript check
        id: tsc
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee tsc.log
      - name: Upload TypeScript diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m17-tsc-log-${{ github.run_id }}
          path: sitesync/tsc.log
          if-no-files-found: error
      - name: ESLint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee eslint.log
      - name: Upload ESLint diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m17-eslint-log-${{ github.run_id }}
          path: sitesync/eslint.log
          if-no-files-found: error
      - name: Fail verification if any gate failed
        if: steps.jest.outcome != 'success' || steps.tsc.outcome != 'success' || steps.lint.outcome != 'success'
        run: exit 1
