name: M1.5 verification

on:
  push:
    branches:
      - mckellarmaddy/mmm-33-m15-qr-attendance
    paths:
      - 'sitesync/**'
      - '.github/workflows/m15-verify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sitesync/**'
      - '.github/workflows/m15-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitesync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: sitesync/package-lock.json

      - name: Require committed lockfile
        run: test -s package-lock.json

      - name: Resolve exact M1.5 dependency graph
        run: npm install --save-exact react-native-vision-camera@5.2.2 react-native-nitro-modules@0.36.5 react-native-nitro-image@0.15.1 react-native-vision-camera-barcode-scanner@5.2.2 react-native-qrcode-svg@6.3.22 react-native-svg@15.13.0

      - name: Validate clean install from generated lockfile
        run: npm ci --ignore-scripts

      - name: Persist dependency lockfile
        working-directory: .
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- sitesync/package.json sitesync/package-lock.json; then
            echo 'Dependency graph already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitesync/package.json sitesync/package-lock.json
          git commit -m 'chore(m1.5): lock VisionCamera QR dependency graph'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Run M1.5 Jest suite
        run: npm test -- --runInBand

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
