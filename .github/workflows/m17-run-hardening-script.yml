name: M1.7 run hardened acceptance patch

on:
  push:
    branches:
      - m17-qa-hardened
    paths:
      - .m17-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/m17_harden_acceptance.py
      - name: Remove temporary patch machinery
        run: rm -f tools/m17_harden_acceptance.py .github/workflows/m17-apply-hardening-patch.yml .github/workflows/m17-run-hardening-script.yml .m17-patch-trigger
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitesync/src/attendance/M17RealRuntimeQaScreenV2.tsx tools/m17_harden_acceptance.py .github/workflows/m17-apply-hardening-patch.yml .github/workflows/m17-run-hardening-script.yml .m17-patch-trigger
          git commit -m "feat(m17): harden physical conflict and failure-path acceptance"
          git push origin HEAD:m17-qa-hardened
